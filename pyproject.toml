[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "msgames-api"
version = "0.1.0"
description = "Typed synchronous and asynchronous access to public MinesweeperGame.com data"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tianyi Pu"}]
dependencies = ["httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/putianyi889/msgames-api"
Documentation = "https://github.com/putianyi889/msgames-api/blob/main/docs/api.md"
Issues = "https://github.com/putianyi889/msgames-api/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-cov>=5", "ruff>=0.11", "mypy>=1.15", "build>=1.2", "twine>=6"]

[project.scripts]
msgames-api = "msgames_api.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/msgames_api"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "tools/verify_live.py", "pyproject.toml", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [".research*", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/msgames_api"]
